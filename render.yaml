services:
  - type: web
    name: split
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci --prefix server --omit=dev && npm ci --prefix client --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.17.0
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SPLIT_OWNER_KEY
        sync: false
